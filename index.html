<title>講透中醫工作坊 二階課 報名表</title>
<meta name="theme-color" content="#294624">

<style>
  /* ===== 品牌色（依 CI 標準色與輔助色） =====
     #294624 深綠｜#e6c692 金｜#faefdf 米白｜#c8c9b3 鼠尾草綠｜#2d747c 青｜#edbeae 粉 */
  :root {
    --page: #faefdf;
    --surface: #fffaf2;
    --ink: #22301f;
    --muted: #5d6a57;
    --heading: #294624;
    --num: #2d747c;
    --line: #dccfb8;
    --field-line: #c8c9b3;
    --btn-bg: #294624;
    --btn-ink: #faefdf;
    --card-bg: #c8c9b3;
    --card-ink: #1d3119;
    --card-line: #aeb098;
    --hero-bg: #294624;
    --hero-gold: #e6c692;
    --hero-ink: #faefdf;
    --error: #9a3b2a;
    --error-bg: #f6ddd3;
    --ok-bg: #e9e6cf;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--hero-bg);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #161f15; --surface: #1d291b; --ink: #efe6d4; --muted: #a9b19c;
      --heading: #e6c692; --num: #e6c692; --line: #2f3d2b; --field-line: #3c4b37;
      --btn-bg: #e6c692; --btn-ink: #1d3119;
      --card-bg: #263424; --card-ink: #efe6d4; --card-line: #3a4a35;
      --hero-bg: #203a1c;
      --error: #f2a593; --error-bg: #3a2420; --ok-bg: #263424;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #161f15; --surface: #1d291b; --ink: #efe6d4; --muted: #a9b19c;
    --heading: #e6c692; --num: #e6c692; --line: #2f3d2b; --field-line: #3c4b37;
    --btn-bg: #e6c692; --btn-ink: #1d3119;
    --card-bg: #263424; --card-ink: #efe6d4; --card-line: #3a4a35;
    --hero-bg: #203a1c;
    --error: #f2a593; --error-bg: #3a2420; --ok-bg: #263424;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Hero：深綠底＋金色 LOGO（CI 第三款配色） ===== */
  .hero {
    background: var(--hero-bg);
    color: var(--hero-ink);
    text-align: center;
    padding: 44px 22px 40px;
    position: relative;
  }
  .hero::after {           /* 底部金色雙線，呼應 LOGO 外框 */
    content: "";
    position: absolute; left: 0; right: 0; bottom: 8px;
    height: 7px;
    border-top: 1.5px solid var(--hero-gold);
    border-bottom: 1.5px solid var(--hero-gold);
    opacity: .7;
  }

  .hero h1 {
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(30px, 7.5vw, 44px);
    line-height: 1.25; letter-spacing: .12em;
    margin: 26px 0 6px;
  }
  .hero .when {
    margin: 0; color: var(--hero-gold);
    font-size: 16px; letter-spacing: .08em;
  }
  .hero .company { margin: 14px 0 0; font-size: 13px; opacity: .75; letter-spacing: .1em; }

  /* ===== 內容 ===== */
  .page { max-width: 620px; margin: 0 auto; padding: 16px 22px 56px; }
  section { padding: 34px 0 30px; }
  section + section { border-top: 1px solid var(--line); }
  h2 {
    font-family: var(--serif); font-weight: 900; font-size: 23px;
    color: var(--heading);
    margin: 0 0 18px; display: flex; align-items: baseline; gap: 12px;
    letter-spacing: .06em;
  }
  h2 .num { color: var(--num); }
  dl.info { margin: 0; display: grid; grid-template-columns: 5.5em 1fr; gap: 10px 16px; }
  dl.info dt { color: var(--muted); font-size: 15px; padding-top: 2px; }
  dl.info dd { margin: 0; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .day {
    border: 1.5px solid var(--heading); color: var(--heading);
    border-radius: 999px; padding: 2px 14px; font-size: 15px; font-weight: 500;
  }
  .year { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .tbd { color: var(--muted); }

  .price {
    font-family: var(--serif); font-weight: 900; color: var(--heading);
    font-size: 40px; line-height: 1.2; letter-spacing: .02em;
  }
  .price small { font-family: var(--sans); font-weight: 500; font-size: 17px; margin-left: 6px; color: var(--ink); }

  /* 匯款資訊卡：鼠尾草綠，雙框線呼應 LOGO */
  .bank {
    margin-top: 22px;
    background: var(--card-bg); color: var(--card-ink);
    border-radius: 14px;
    padding: 20px 20px 10px;
    outline: 1.5px solid var(--card-bg); outline-offset: 4px;
    margin-left: 5px; margin-right: 5px;
  }
  .bank h3 { font-family: var(--serif); font-weight: 900; font-size: 18px; margin: 0 0 8px; letter-spacing: .08em; }
  .bank dl { margin: 0; }
  .bank .row {
    display: grid; grid-template-columns: 4.2em 1fr auto; gap: 4px 12px;
    align-items: center;
    padding: 10px 0; border-top: 1px solid var(--card-line);
  }
  .bank .row:first-child { border-top: 0; }
  .bank dt { font-size: 14px; opacity: .8; }
  .bank dd { margin: 0; font-weight: 500; }
  .acct { font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: .08em; font-variant-numeric: tabular-nums; word-break: break-all; }
  .copy {
    font: inherit; font-size: 14px; font-weight: 500;
    background: transparent; color: var(--card-ink);
    border: 1.5px solid currentColor; border-radius: 999px;
    padding: 3px 12px; cursor: pointer; white-space: nowrap;
  }
  .copy.copied { background: var(--card-ink); color: var(--card-bg); }

  /* 表單 */
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input[type="text"], input[type="tel"], input[type="password"] {
    width: 100%;
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--field-line); border-radius: 10px;
    padding: 12px 14px;
  }
  input::placeholder { color: var(--muted); opacity: .7; }
  input:focus-visible { outline: 3px solid color-mix(in srgb, var(--heading) 30%, transparent); border-color: var(--heading); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .err { color: var(--error); font-size: 14px; margin-top: 4px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button.primary, button.ghost {
    font: inherit; font-weight: 700;
    border-radius: 10px; cursor: pointer;
    padding: 13px 22px;
  }
  button.primary { border: 0; background: var(--btn-bg); color: var(--btn-ink); }
  button.ghost { background: transparent; color: var(--heading); border: 1.5px solid var(--heading); }
  button:focus-visible { outline: 3px solid var(--num); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: progress; }
  .btn-block { width: 100%; font-size: 18px; letter-spacing: .2em; margin-top: 6px; padding: 15px; }
  .form-msg:not(:empty) { margin-top: 14px; font-size: 15px; color: var(--error); background: var(--error-bg); border-radius: 8px; padding: 10px 14px; }

  .done {
    display: grid; grid-template-columns: 64px 1fr; gap: 18px; align-items: center;
    background: var(--ok-bg); border-radius: 14px; padding: 22px;
  }

        <input id="name" name="name" type="text" autocomplete="name" maxlength="50" required>
        <div class="err" id="name-err" role="alert"></div>
      </div>
      <div class="field">
        <label for="phone">電話</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="例：0912345678" required>
        <div class="err" id="phone-err" role="alert"></div>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="website">請勿填寫此欄</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="primary btn-block" id="submit-btn">送出報名</button>
      <div class="form-msg" id="form-msg" role="alert"></div>
    </form>

    <div class="done" id="done" hidden tabindex="-1">
      <div class="crane" aria-hidden="true"></div>
      <div>
        <h3>報名已送出</h3>
        <p id="done-text">我們已收到你的報名資料，後續將由工作人員以電話與你聯繫。</p>
      </div>
    </div>
  </section>
</main>

<!-- ============ 管理頁（網址加上 #admin 進入） ============ -->
<main id="view-admin" class="page" hidden>
  <section>
    <h2>報名名單</h2>
    <form class="admin-bar" id="admin-form">
      <div class="field">
        <label for="admin-key">管理密碼</label>
        <input id="admin-key" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" id="load-btn">載入名單</button>
    </form>
    <div class="form-msg" id="admin-msg" role="alert"></div>

    <div id="admin-result" hidden>
      <div class="admin-actions">
        <span class="count" id="count"></span>
        <button type="button" class="ghost" id="reload-btn">重新整理</button>
        <button type="button" class="primary" id="export-btn">匯出 Excel</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>報名時間</th><th>姓名</th><th>電話</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="herbs" aria-hidden="true"><span class="g"></span><span class="l"></span></div>
  講透中醫工作坊 二階課　｜　杏樵有限公司
</footer>

<script>
/* ==========================================================
   ★ 部署 Google Apps Script 後，把「網頁應用程式網址」貼在這裡
   ========================================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7oyBsZRW5SxGCnSyKu15-ZIOw-NhmmHvfTY8Yn8BqLQo-D10idABeqOCWEi4SgFq-/exec";

/* ---------- 頁面切換 ---------- */
function route() {
  const admin = location.hash === "#admin";
  document.getElementById("view-form").hidden = admin;
  document.getElementById("view-admin").hidden = !admin;
  document.getElementById("hero-title").textContent = admin ? "二階課 報名名單" : "二階課 報名表";
  document.title = admin ? "二階課 報名名單" : "講透中醫工作坊 二階課 報名表";
}
window.addEventListener("hashchange", route);
route();

async function callScript(params) {
  if (!SCRIPT_URL) throw new Error("NO_URL");
  const res = await fetch(SCRIPT_URL, { method: "POST", body: new URLSearchParams(params) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ---------- 複製匯款資訊 ---------- */
document.querySelectorAll(".copy").forEach(b => {
  const label = b.textContent;
  b.addEventListener("click", async () => {
    const text = b.dataset.copy;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch {}
      t.remove();
    }
    b.textContent = "已複製";
    b.classList.add("copied");
    document.getElementById("copy-live").textContent = "已複製 " + text;
    setTimeout(() => { b.textContent = label; b.classList.remove("copied"); }, 1600);
  });
});

/* ---------- 報名表 ---------- */
const form = document.getElementById("signup");
const nameEl = document.getElementById("name");
const phoneEl = document.getElementById("phone");
const btn = document.getElementById("submit-btn");
const msg = document.getElementById("form-msg");

function setErr(input, text) {
  document.getElementById(input.id + "-err").textContent = text;
  input.setAttribute("aria-invalid", text ? "true" : "false");
}
function validate() {
  let ok = true;
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const digits = phone.replace(/\D/g, "");
  if (!name) { setErr(nameEl, "請填寫姓名"); ok = false; } else setErr(nameEl, "");
  if (!phone) { setErr(phoneEl, "請填寫電話"); ok = false; }
  else if (!/^[\d\s\-+()#]+$/.test(phone) || digits.length < 8 || digits.length > 15) {
    setErr(phoneEl, "電話格式不正確，請填寫 8 到 15 位數字"); ok = false;
  } else setErr(phoneEl, "");
  return ok;
}
[nameEl, phoneEl].forEach(el => el.addEventListener("blur", () => { if (el.value) validate(); }));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = "";
  if (!validate()) { form.querySelector('[aria-invalid="true"]')?.focus(); return; }
  btn.disabled = true;
  btn.textContent = "送出中…";
  try {
    const data = await callScript({
      action: "submit",
      name: nameEl.value.trim(),
      phone: phoneEl.value.trim(),
      website: document.getElementById("website").value
    });
    if (!data.ok) throw new Error(data.error || "unknown");
    form.hidden = true;
    document.getElementById("done-text").textContent =
      nameEl.value.trim() + "，我們已收到你的報名資料，後續將由工作人員以電話與你聯繫。";
    const done = document.getElementById("done");
    done.hidden = false;
    done.focus();
  } catch (err) {
    msg.textContent = err.message === "NO_URL"
      ? "報名系統尚未設定完成，請聯繫主辦單位。"
      : "送出沒有成功，請檢查網路後再按一次「送出報名」。";
    btn.disabled = false;
    btn.textContent = "送出報名";
  }
});

/* ---------- 管理頁 ---------- */
let currentRows = [];
const adminMsg = document.getElementById("admin-msg");
const loadBtn = document.getElementById("load-btn");

async function loadRows() {
  adminMsg.textContent = "";
  loadBtn.disabled = true;
  loadBtn.textContent = "載入中…";
  try {
    const data = await callScript({ action: "list", key: document.getElementById("admin-key").value });
    if (!data.ok) throw new Error(data.error);
    currentRows = data.rows;
    renderRows();
  } catch (err) {
    adminMsg.textContent =
      err.message === "NO_URL" ? "尚未在程式碼中填入 SCRIPT_URL。" :
      err.message === "unauthorized" ? "管理密碼不正確。" :
      "載入失敗，請稍後再試。";
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = "載入名單";
  }
}
function renderRows() {
  const tbody = document.getElementById("rows");
  tbody.replaceChildren();
  currentRows.forEach((r, i) => {
    const tr = document.createElement("tr");
    [String(i + 1), r.time, r.name, r.phone].forEach((v, j) => {
      const td = document.createElement("td");
      td.textContent = v;
      if (j === 0) td.className = "idx";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById("count").textContent = "共 " + currentRows.length + " 筆報名";
  document.getElementById("admin-result").hidden = false;
  document.getElementById("export-btn").disabled = currentRows.length === 0;
}
document.getElementById("admin-form").addEventListener("submit", e => { e.preventDefault(); loadRows(); });
document.getElementById("reload-btn").addEventListener("click", loadRows);

document.getElementById("export-btn").addEventListener("click", () => {
  const sheetData = [["序號", "報名時間", "姓名", "電話"]].concat(
    currentRows.map((r, i) => [i + 1, r.time, r.name, String(r.phone)])
  );
  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  for (let i = 1; i < sheetData.length; i++) {
    const cell = ws[XLSX.utils.encode_cell({ r: i, c: 3 })];
    if (cell) { cell.t = "s"; cell.z = "@"; }
  }
  ws["!cols"] = [{ wch: 6 }, { wch: 20 }, { wch: 14 }, { wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "二階報名");
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  XLSX.writeFile(wb, "二階課報名名單_" + stamp + ".xlsx");
});
</script>
</body>
</html>
